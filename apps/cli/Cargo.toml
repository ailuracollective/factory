[package]
name = "factory"
version = "0.1.0"
edition = "2021"
description = "AI Factory: listens to GitHub issues and launches T3 Code agents to resolve them."
license = "MIT"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "2"
dirs = "5"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tracing = "0.1"
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "runtime-tokio-native-tls"] }
uuid = { version = "1", features = ["v7"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

