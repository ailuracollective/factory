name = "ailura-factory-gateway"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-21"

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "ailura-factory"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Secrets are never committed. Set them with:
#   wrangler secret put GITHUB_WEBHOOK_SECRET
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put RUNNER_BOOTSTRAP_SECRET
# Optional non-secret configuration:
#   GITHUB_ALLOWED_REPOS = "owner/repo,owner/other"
#   GITHUB_INSTALLATION_ID = "123456"
# For local development, copy .dev.vars.example to .dev.vars.
