[package]
name = "factory-gateway"
version = "0.1.0"
edition = "2021"
description = "Ailura Factory Gateway (Cloudflare Worker)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.9", features = ["http", "d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "Response"] }
