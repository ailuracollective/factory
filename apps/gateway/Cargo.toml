[package]
name = "gateway"
version = "0.1.0"
edition.workspace = true
description = "Ailura Factory Gateway (Cloudflare Worker)"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ohkami = { version = "0.24", features = ["rt_worker"] }
worker = { version = "0.9", features = ["d1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "Response"] }
async-trait = "0.1"
sea-orm = { version = "2.0", default-features = false, features = ["macros", "proxy", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false }
