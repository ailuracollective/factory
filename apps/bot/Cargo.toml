[package]
name = "bot"
version = "0.1.0"
edition.workspace = true
description = "Ailura Factory bot: receives notifications and displays them in chat."
license.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
notifications = { path = "../../internal/notifications" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = "0.3"
